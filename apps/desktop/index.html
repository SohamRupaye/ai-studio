<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- img-src: data: for stored project icons (small data-URL PNGs in the DB)
         and images embedded in docx previews (mammoth emits data: URLs),
         blob: for decoding freshly picked image files before cropping.
         worker-src: 'self' for the bundled pdf.js worker, blob: for its
         fallback path when it wraps the script in a blob: URL. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:"
    />
    <title>AI Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/renderer/index.tsx"></script>
  </body>
</html>
