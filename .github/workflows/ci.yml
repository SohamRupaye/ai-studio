name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-turbo: 'true'

      - name: Build packages
        run: yarn turbo run build --filter='!@squirl/desktop'

      - name: Typecheck
        run: yarn turbo run typecheck

      - name: Lint
        run: yarn turbo run lint

      - name: Duplicate code check (jscpd)
        run: yarn dupcheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          cache-turbo: 'true'

      - name: Build packages
        run: yarn turbo run build --filter='!@squirl/desktop'

      - name: Run unit tests with coverage
        run: yarn turbo run test:unit -- --coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-report
          path: |
            packages/*/coverage/
            apps/desktop/coverage/
          retention-days: 7
          if-no-files-found: ignore

  desktop-build:
    name: Desktop Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Verifies the Electron app (main, preload, renderer) builds and packages cleanly end to end.
      - name: Build & package desktop app
        run: yarn turbo run build --filter=@squirl/desktop
